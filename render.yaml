services:
  # Web Service
  - type: web
    name: klaimguard-ai
    runtime: docker                       
    repo: https://github.com/HasbiHasyidan/KlaimGuard_Healthkaton2026
    branch: main
    region: singapore                     

    # Plan: free
    plan: free

    # Dockerfile & konteks build
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Environment variables
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PORT
        value: "8000"

    # Health check endpoint
    healthCheckPath: /health

