services:
  klaimguard:
    container_name: klaimguard-ai
    build:
      context: .
      dockerfile: Dockerfile
    image: klaimguard-ai:latest
    ports:
      # Akses langsung via IP VPS (port 80 standar browser tanpa :8000)
      - "80:8000"
      # Port alternatif backend
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Session cookie secret
      - KLAIMGUARD_AUTH_SECRET=klaimguard-enterprise-secret-key-healthkaton2026
      # Set "false" saat akses via http://IP-VPS, set "true" jika sudah ada domain HTTPS
      - KLAIMGUARD_COOKIE_SECURE=false
      # Google Gemini AI Copilot (otomatis terbaca dari file .env di server)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
    volumes:
      # Data persisten SQLite, model XGBoost, ChromaDB, dan berkas upload rumah sakit
      - klaimguard-data:/data
      # Mount folder regulasi PDF resmi (read-only)
      - ./backend/regulation_docs:/app/backend/regulation_docs:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  klaimguard-data:
    driver: local
